[versions]
agp = "9.5.1"
# Kotlin embarqué par AGP 9.5.1 (kotlin-gradle-plugin 2.2.10).
# Le plugin Compose compiler doit avoir exactement cette version.
kotlin = "2.2.10"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
junit = "4.13.2"
# KSP2 : versionné indépendamment de Kotlin depuis 2.3.0 ; compatible Kotlin 2.2.x
# et le Kotlin intégré d'AGP 9 (pas de plugin org.jetbrains.kotlin.android).
ksp = "2.3.13"
room = "2.8.5"
# androidx.sqlite (API Support utilisée par SQLCipher) : sqlcipher-android 4.20.0 exige 2.7.0,
# Room 2.8.5 demande 2.6.2 ; on déclare le correctif 2.7.1 (même groupe atomique, rétrocompatible).
androidxSqlite = "2.7.1"
sqlcipher = "4.20.0"
# room-testing 2.8.5 tire kotlinx-serialization-json 1.8.1 : core doit être aligné (1.7.3 → AbstractMethodError).
kotlinxSerialization = "1.8.1"
robolectric = "4.17"
# Version déjà résolue par Compose/Activity dans ce projet (ne pas la dépasser sans le vérifier).
lifecycle = "2.9.4"
# Aligné sur kotlinx-coroutines-core 1.9.0 résolu.
coroutines = "1.9.0"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
# espresso-core 3.5.0 (tiré par ui-test-junit4) appelle InputManager.getInstance, retiré en API 37.
espressoCore = "3.7.0"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "androidxSqlite" }
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
